version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ml_lab}
      POSTGRES_USER: ${DB_USER:-ml_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_secrets_env}
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data_lab3:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-root-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"

  vault-init:
    image: hashicorp/vault:1.16
    depends_on:
      - vault
    entrypoint: ["sh", "/vault/init.sh"]
    env_file:
      - ./vault/secrets.env
    volumes:
      - ./vault/init.sh:/vault/init.sh:ro

  model-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-root-dev-token}
    ports:
      - "8000:8000"

volumes:
  pg_data_lab3:
