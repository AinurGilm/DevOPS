version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ml_lab}
      POSTGRES_USER: ${DB_USER:-ml_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data_lab2:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  model-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ml_lab}
      DB_USER: ${DB_USER:-ml_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "8000:8000"

volumes:
  pg_data_lab2:
