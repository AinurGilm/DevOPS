version: "3.9"

services:
  # ---------- ЛР№2: источник данных ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ml_lab}
      POSTGRES_USER: ${DB_USER:-ml_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_secrets_env}
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ml_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- ЛР№3: хранилище секретов ----------
  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-root-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"

  vault-init:
    image: hashicorp/vault:1.16
    depends_on:
      - vault
    entrypoint: ["sh", "/vault/init.sh"]
    env_file:
      - ./vault/secrets.env
    volumes:
      - ./vault/init.sh:/vault/init.sh:ro

  # ---------- ЛР№4: очередь сообщений ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  # ---------- ЛР№1: сервис модели (Producer встроен) ----------
  model-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
      - vault
      - kafka
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-root-dev-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"

  # ---------- ЛР№4: Consumer ----------
  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    depends_on:
      - kafka
      - vault
      - model-api
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-root-dev-token}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

volumes:
  pg_data:
